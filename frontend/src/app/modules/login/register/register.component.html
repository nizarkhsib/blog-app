<form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="auth-form">

  <div class="name-row">
    <mat-form-field appearance="outline" class="half-width">
      <mat-label>First name</mat-label>
      <input matInput type="text" formControlName="firstname" placeholder="First name">
      <mat-error *ngIf="submitted && f.firstname.errors?.required">Required</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="half-width">
      <mat-label>Last name</mat-label>
      <input matInput type="text" formControlName="lastname" placeholder="Last name">
      <mat-error *ngIf="submitted && f.lastname.errors?.required">Required</mat-error>
    </mat-form-field>
  </div>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Email</mat-label>
    <mat-icon matPrefix>email</mat-icon>
    <input matInput type="email" formControlName="email" placeholder="Enter your email">
    <mat-error *ngIf="f.email.errors?.required">Email is required</mat-error>
    <mat-error *ngIf="f.email.errors?.email">Email is not valid</mat-error>
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Password</mat-label>
    <mat-icon matPrefix>lock</mat-icon>
    <input matInput type="password" formControlName="password" placeholder="Min. 6 characters">
    <mat-error *ngIf="f.password.errors?.required">Password is required</mat-error>
    <mat-error *ngIf="f.password.errors?.minlength">Must be at least 6 characters</mat-error>
  </mat-form-field>

  <mat-error *ngIf="registerError" class="error-msg">{{ errorMessage }}</mat-error>

  <button
    mat-flat-button
    color="primary"
    class="submit-btn"
    [disabled]="loading || registerForm.invalid"
  >
    <span *ngIf="loading" class="spinner-border spinner-border-sm mr-1"></span>
    Create Account
  </button>

  <p class="footer-link">
    Already have an account?
    <a routerLink="../login">Sign in</a>
  </p>
</form>
