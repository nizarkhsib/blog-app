<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo">
        <mat-icon>edit_note</mat-icon>
      </div>
      <h1>Welcome</h1>
      <p>Sign in to continue to your account</p>
    </div>

    <nav mat-tab-nav-bar class="auth-tabs" [tabPanel]="tabPanel">
      <a
        mat-tab-link
        *ngFor="let tabItem of tabs"
        [routerLink]="tabItem.route"
        routerLinkActive
        #rla="routerLinkActive"
        [active]="rla.isActive"
      >
        {{tabItem.label}}
      </a>
    </nav>

    <div class="auth-body">
      <mat-tab-nav-panel #tabPanel>
        <router-outlet></router-outlet>
      </mat-tab-nav-panel>
    </div>
  </div>
</div>
