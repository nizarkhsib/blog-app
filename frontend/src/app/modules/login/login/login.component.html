<form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form">

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Email</mat-label>
    <mat-icon matPrefix>email</mat-icon>
    <input matInput type="text" formControlName="email" placeholder="Enter your email">
    <mat-error *ngIf="submitted && f.email.errors?.required">Email is required</mat-error>
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Password</mat-label>
    <mat-icon matPrefix>lock</mat-icon>
    <input matInput type="password" formControlName="password" placeholder="Enter your password">
    <mat-error *ngIf="submitted && f.password.errors?.required">Password is required</mat-error>
  </mat-form-field>

  <button
    mat-flat-button
    color="primary"
    class="submit-btn"
    [disabled]="loading || loginForm.invalid"
  >
    <span *ngIf="loading" class="spinner-border spinner-border-sm mr-1"></span>
    Sign In
  </button>

  <mat-error *ngIf="error" class="error-msg">
    Bad email or password!
  </mat-error>

  <div class="divider">
    <span>or continue with</span>
  </div>

  <div class="social-buttons">
    <button type="button" mat-stroked-button class="social-btn" (click)="loginWithGoogle()">
      <mat-icon>mail</mat-icon>
      Google
    </button>
    <button type="button" mat-stroked-button class="social-btn" (click)="loginWithFacebook()">
      <mat-icon>facebook</mat-icon>
      Facebook
    </button>
  </div>

  <p class="footer-link">
    Don't have an account?
    <a (click)="navigateToRegister()">Register here</a>
  </p>
</form>
