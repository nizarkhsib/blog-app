<div class="content">
  <!-- Search bar -->
  <div class="search-bar">
    <mat-icon class="search-icon">search</mat-icon>
    <input
      type="text"
      class="search-input"
      placeholder="Search articles by title, content, or tags..."
      [value]="searchQuery"
      (input)="onSearchInput($event)"
    />
    <button
      *ngIf="searchQuery"
      mat-icon-button
      class="clear-btn"
      (click)="clearSearch()"
    >
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- No results -->
  <div class="empty-state" *ngIf="!isLoading && articles.length === 0 && searchQuery">
    <mat-icon class="empty-icon">search_off</mat-icon>
    <p>No articles found for "<b>{{ searchQuery }}</b>"</p>
  </div>

  <div
    class="articles-grid"
    *ngIf="articles.length > 0"
    [ngStyle]="{'grid-template-columns': 'repeat(' + gridColumns + ', minmax(0, 1fr))'}"
  >
    <div
      class="article-grid-item d-flex justify-content-center"
      *ngFor="let article of articles; let index = index;"
    >
      <article-card
        (click)="articleClicked(article)"
        class="article-card"
        [article]="article"
        [index]="index"
      ></article-card>
    </div>
  </div>

  <!-- Loading spinner -->
  <div class="center" *ngIf="isLoading">
    <mat-spinner diameter="40"></mat-spinner>
  </div>

  <!-- End-of-list message -->
  <div class="end-of-list" *ngIf="!isLoading && articles.length >= count && articles.length > 0">
    You've reached the end
  </div>

  <!-- Sentinel element observed for infinite scroll -->
  <div #sentinel class="sentinel"></div>
</div>
