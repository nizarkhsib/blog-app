<mat-sidenav-container class="sidenav-container">
  <mat-sidenav
    #drawer
    class="sidenav"
    fixedInViewport
    [attr.role]="(isHandset$ | async) ? 'dialog' : 'navigation'"
    [mode]="(isHandset$ | async) ? 'over' : 'side'"
    [opened]="(isHandset$ | async) === false"
  >
    <mat-toolbar></mat-toolbar>
    <mat-nav-list>
      <a
        mat-list-item
        href="#"
      >
        <mat-icon>home</mat-icon>
        <mat-divider></mat-divider>
      </a>
    </mat-nav-list>
  </mat-sidenav>
  <mat-sidenav-content>
    <div class="wrapper">
      <mat-toolbar-row class="box header">

        <button
          type="button"
          aria-label="Toggle sidenav"
          mat-icon-button
          (click)="drawer.toggle()"
          *ngIf="isHandset$ | async"
        >
          <mat-icon aria-label="Side nav toggle icon">menu</mat-icon>
        </button>

        <span class="spacer"></span>

        <section
          class="d-flex align-items-center gap-2"
          [ngClass]="{ 'user-logged': !(isHandset$ | async)  }"
        >
          <button
            *ngIf="!isLogged"
            mat-raised-button
            color="basic"
            (click)="navigateToLogin()"
          >
            Login
          </button>

          <button
            *ngIf="isLogged"
            mat-raised-button
            (click)="navigateToWriteArticle()"
          >
            <mat-icon>note_add</mat-icon>
            Write article
          </button>
          <button
            mat-mini-fab
            [matMenuTriggerFor]="profileMenu"
            *ngIf="isLogged"
            color="basic"
            [style.marginLeft.px]="10"
            class="profile-fab"
          >
            <img [src]="profilePhotoUrl || '/assets/default-avatar.svg'" class="profile-fab-img" alt="Profile" />
          </button>
          <mat-menu
            class="profile-menu"
            #profileMenu="matMenu"
          >
            <div class="menu-user-header" (click)="$event.stopPropagation()">
              <div class="menu-avatar">
                <img [src]="profilePhotoUrl || '/assets/default-avatar.svg'" class="menu-avatar-img" alt="Profile" />
              </div>
              <div class="menu-user-info">
                <span class="menu-user-name">{{ loggedUser?.firstname }} {{ loggedUser?.lastname }}</span>
                <span class="menu-user-email">{{ loggedUser?.email }}</span>
              </div>
            </div>

            <mat-divider></mat-divider>

            <button
              (click)="navigateToProfile()"
              mat-menu-item
              class="menu-item"
            >
              <mat-icon>account_circle</mat-icon>
              <span>My Profile</span>
            </button>

            <button
              (click)="navigateToWriteArticle()"
              mat-menu-item
              class="menu-item"
            >
              <mat-icon>edit_note</mat-icon>
              <span>Write</span>
            </button>

            <mat-divider></mat-divider>

            <button
              mat-menu-item
              (click)="logout()"
              class="menu-item logout-item"
            >
              <mat-icon>logout</mat-icon>
              <span>Logout</span>
            </button>

          </mat-menu>

        </section>

      </mat-toolbar-row>
      <section class="box content">
        <router-outlet></router-outlet>
      </section>

    </div>

  </mat-sidenav-content>
</mat-sidenav-container>
