<div class="modal-header">
  <h2 class="modal-title">Edit Profile</h2>
  <button mat-icon-button class="close-btn" (click)="close()">
    <mat-icon>close</mat-icon>
  </button>
</div>

<form [formGroup]="profileForm" class="modal-body">

  <div class="avatar-upload-section" (click)="fileInput.click()">
    <input type="file" hidden #fileInput accept="image/*" (change)="onSelect($event)" />
    <div class="avatar-circle">
      <img *ngIf="filePreviewUrl" [src]="filePreviewUrl" class="avatar-preview" alt="Profile preview" />
      <mat-icon *ngIf="!filePreviewUrl" class="avatar-placeholder-icon">person</mat-icon>
    </div>
    <div class="avatar-upload-hint">
      <mat-icon>photo_camera</mat-icon>
      <span>{{ filePreviewUrl ? 'Change photo' : 'Upload photo' }}</span>
    </div>
    <button
      *ngIf="filePreviewUrl"
      mat-icon-button
      class="avatar-remove-btn"
      type="button"
      (click)="onRemove(); $event.stopPropagation()"
    >
      <mat-icon>delete</mat-icon>
    </button>
  </div>

  <div class="form-row">
    <mat-form-field appearance="outline" class="half-field">
      <mat-label>First name</mat-label>
      <input matInput required placeholder="First name" type="text" formControlName="firstname">
    </mat-form-field>

    <mat-form-field appearance="outline" class="half-field">
      <mat-label>Last name</mat-label>
      <input matInput required placeholder="Last name" type="text" formControlName="lastname">
    </mat-form-field>
  </div>

  <mat-form-field appearance="outline" class="full-field">
    <mat-label>Email</mat-label>
    <input matInput placeholder="Email" type="email" [readonly]="true" formControlName="email">
  </mat-form-field>

</form>

<div class="modal-footer">
  <button mat-stroked-button class="cancel-btn" (click)="close()">Cancel</button>
  <button
    mat-raised-button
    color="primary"
    class="save-btn"
    (click)="save()"
    [disabled]="loading || !file || profileForm.invalid"
  >
    <mat-icon>save</mat-icon>
    Save changes
  </button>
</div>
