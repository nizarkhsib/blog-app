<section>

  <div
    class="d-flex flex-row"
    style="gap: 10px;"
    *ngFor="let comment of comments"
  >
    <mat-card *ngIf="comment.author">

      <div
        mat-card-avatar
        class="example-header-image"
      >
      </div>

      <div
        class="comment-content"
        style="flex: 0 0 80%; gap: 10px; display: flex; flex-direction: column;"
      >
        <div class="d-flex flex-row">
          <span>
            <b>
              {{comment.author.firstname}} {{comment.author.lastname}}
            </b>
          </span>
        </div>

        <div class="d-flex flex-row">
          <div>{{comment.content}}</div>
        </div>

      </div>
    </mat-card>

  </div>

  <span
    class="view-more"
    (click)="viewMoreClicked()"
    *ngIf="comments.length < commentsCount"
  >
    <b>View more</b>
  </span>

</section>
