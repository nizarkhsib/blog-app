<div class="blog-card" *ngIf="article">
  <!-- Cover Image -->
  <div class="card-cover" *ngIf="article.coverImage || article.filePath">
    <img
      [src]="article.coverImage || article.filePath"
      alt=""
      class="cover-img"
    />
  </div>
  <div class="card-cover card-cover-placeholder" *ngIf="!article.coverImage && !article.filePath">
    <mat-icon class="placeholder-icon">article</mat-icon>
  </div>

  <!-- Card Body -->
  <div class="card-body">
    <!-- Tags -->
    <div class="tags-row" *ngIf="article?.tags?.length > 0">
      <span class="tag" *ngFor="let tag of article.tags | slice:0:3">#{{tag}}</span>
    </div>

    <h3 class="card-title">{{article.title}}</h3>
    <p class="card-description">{{article?.description}}</p>

    <!-- Author & Meta -->
    <div class="card-meta">
      <div class="author-info">
        <div class="author-avatar">
          {{article?.author?.firstname?.[0]}}{{article?.author?.lastname?.[0]}}
        </div>
        <div class="author-details">
          <span class="author-name">{{article?.author?.firstname}} {{article?.author?.lastname}}</span>
          <span class="article-date">{{article.createdAt | date:'mediumDate'}}</span>
        </div>
      </div>
      <div class="card-stats">
        <span class="stat"><mat-icon>favorite_border</mat-icon> {{article.likes || 0}}</span>
      </div>
    </div>
  </div>
</div>
