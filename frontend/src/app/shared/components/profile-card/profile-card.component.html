<div
  *ngIf="profile"
  class="container"
>
  <div class="main-body">
    <mat-card class="profile-card">
      <div class="profile-card-content">
        <!-- Profile Image -->
        <div class="profile-image-section">
          <img
            [src]="photoPath"
            alt="Admin"
            class="profile-image"
          >
        </div>

        <!-- Name and Email -->
        <div class="profile-info-section">
          <span class="profile-name">
            {{profile.user.firstname}} {{profile.user.lastname}}
          </span>
          <div class="text-secondary" *ngIf="isOwnProfile">{{profile.user.email}}</div>
          <div class="button-group">
            <button
              *ngIf="isOwnProfile"
              mat-stroked-button
              color="primary"
              (click)="onEditClicked()"
              class="edit-button"
            >
              Edit profile
            </button>
            <button
              *ngIf="!isOwnProfile && isLoggedIn"
              mat-raised-button
              [color]="isFollowing ? 'warn' : 'primary'"
              (click)="toggleFollow()"
              [disabled]="followButtonLoading"
              class="follow-button"
            >
              {{ isFollowing ? 'Unfollow' : 'Follow' }}
            </button>
          </div>
        </div>

        <!-- Stats -->
        <div class="profile-stats-section">
          <div class="stat-item">
            <div class="stat-value"><b>{{articlesCount}}</b></div>
            <div class="stat-label">Articles</div>
          </div>
          <div class="stat-item">
            <div class="stat-value"><b>{{followersCount}}</b></div>
            <div class="stat-label">Followers</div>
          </div>
          <div class="stat-item">
            <div class="stat-value"><b>{{followingCount}}</b></div>
            <div class="stat-label">Following</div>
          </div>
        </div>
      </div>
    </mat-card>
  </div>
</div>
